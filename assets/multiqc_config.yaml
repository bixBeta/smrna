show_analysis_paths: False
show_analysis_time: False

# MQC_GENOME is exported by the MULTIQC process, set to "NA" when the run had
# no --genome and QUANT never ran.
report_header_info:
  - Contact E-mail: 'trex_info@cornell.edu'
  - Reference Genome: !ENV "${MQC_GENOME}"

# Pin the report to light. Left at its default of true, the template follows the
# viewer's prefers-color-scheme, so the same report renders dark on some
# machines and light on others. Note this also removes the dark-mode toggle.
template_dark_mode: False

# DUMP_VERSIONS builds the Software Versions section, so switch off MultiQC's
# own detection - otherwise the report carries two of them whenever a module
# happens to find a version it can parse.
disable_version_detection: True

report_comment: >
  smRNA-seq QC — generated by the <a href="https://github.com/bixbeta/smrna">smrna</a> pipeline.
  Length and 5'-nucleotide panels are derived from the miRDeep2 collapsed-read table.

# The logo itself is staged into the work dir, so its path is passed on the
# command line with --cl-config rather than hard-coded here.
custom_logo_url: https://trex.biotech.cornell.edu/
custom_logo_title: "TREx"

# fastp first (raw trimming), then the smRNA-specific panels.
module_order:
  - fastp

# Keep only fastp's Filtered Reads chart. Its per-base quality/GC/N curves are
# averaged over reads whose real length is the insert, so they are misleading
# on smRNA libraries; length and composition are covered by the panels below.
remove_sections:
  - fastp-duprates
  - fastp-insert-size
  - fastp-seq-quality
  - fastp-seq-content-gc
  - fastp-seq-content-n

# Sections sort by descending order, so more negative sinks further down.
report_section_order:
  smrna_length_reads:
    order: -100
  smrna_length_distinct:
    order: -200
  smrna_first_base:
    order: -300
  smrna_mirbase_by_length:
    order: -400
  pipeline_software_versions:
    order: -1000

table_columns_visible:
  fastp:
    pct_duplication: False
    after_filtering_gc_content: False

# Collapsed reads are counted once per unique sequence, so fastp's own read
# counts and the smRNA totals are not directly comparable - keep them distinct.
custom_table_header_config:
  general_stats_table:
    smrna_total_reads:
      format: "{:,.0f}"

# fastp records the input fastq name in its JSON, so MultiQC would otherwise
# call the sample SS1_R1 while the smRNA panels call it SS1 - giving two
# half-empty rows per sample in General Statistics. The pipeline writes
# ${id}.fastp.json, so the filename is the sample label by construction.
use_filename_as_sample_name:
  - fastp

extra_fn_clean_exts:
  - "_trimmed"
  - ".fastp"
  - "_mqc"
  - "_R1"
  - "_R2"
